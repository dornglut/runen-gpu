[package]
name = "runen-gpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license.workspace = true
repository = "https://github.com/dornglut/runen-gpu"
description = "Backend-neutral GPU execution framework"
publish = false

[features]
default = []

[workspace]
resolver = "3"
members = ["xtask"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

[lints]
workspace = true

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
