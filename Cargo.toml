[package]
name = "runen-gpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license.workspace = true
repository = "https://github.com/dornglut/runen-gpu"
description = "Backend-neutral GPU execution framework"
publish = false

[features]
default = []

[dependencies]
bytemuck = { version = "1.24.0", default-features = false }
naga = { version = "30.0.0", default-features = false, features = ["wgsl-in"] }
raw-window-handle = { version = "0.6.2", default-features = false }
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
wgpu = "30.0.0"

[dev-dependencies]
bytemuck = { version = "1.24.0", default-features = false, features = ["derive"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
pollster = "0.4.0"
serde_json = "1.0.149"
wgpu = { version = "30.0.0", features = ["noop"] }
winit = "0.30.12"

[[test]]
name = "gpu_browser_webgpu"
path = "tests/gpu_browser_webgpu.rs"
harness = false

[workspace]
resolver = "3"
members = ["xtask"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

[lints]
workspace = true

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
