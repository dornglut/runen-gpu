              '    }\n'
              '    pub const fn max_texture_dimension_1d(self) -> u32 {\n'
              '        self.max_texture_dimension_1d\n'
              '    }\n'
              '    pub const fn max_texture_dimension_3d(self) -> u32 {\n'
              '        self.max_texture_dimension_3d\n'
              '    }\n'
              '    pub const fn max_texture_array_layers(self) -> u32 {\n'
              '        self.max_texture_array_layers\n'
              '    }\n'
              '    pub const fn max_vertex_attributes(self) -> u32 {\n'
              '        self.max_vertex_attributes\n'
              '    }\n'
              '    pub const fn max_vertex_buffer_array_stride(self) -> u32 {\n'
              '        self.max_vertex_buffer_array_stride\n'
              '    }',
          )
          replace_once(
              capability,
              '        max_compute_workgroups_per_dimension: u32,\n    ) -> Self {',
              '        max_compute_workgroups_per_dimension: u32,\n'
              '        max_buffer_size: u64,\n'
              '        max_texture_dimension_1d: u32,\n'
              '        max_texture_dimension_3d: u32,\n'
              '        max_texture_array_layers: u32,\n'
              '        max_vertex_attributes: u32,\n'
              '        max_vertex_buffer_array_stride: u32,\n'
              '    ) -> Self {',
          )
          replace_once(
              capability,
              '            max_compute_workgroups_per_dimension,\n        }\n    }\n}',
              '            max_compute_workgroups_per_dimension,\n'
              '            max_buffer_size,\n'
              '            max_texture_dimension_1d,\n'
              '            max_texture_dimension_3d,\n'
              '            max_texture_array_layers,\n'
              '            max_vertex_attributes,\n'
              '            max_vertex_buffer_array_stride,\n'
              '        }\n    }\n}',
          )
          replace_once(
