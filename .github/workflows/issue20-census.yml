              '        ));\n'
              '    }',
              '    if total_attributes > device_limits.max_vertex_attributes()\n'
              '        || total_attributes > workload_limits.max_vertex_attributes()\n'
              '    {\n'
              '        return Err(incompatible(\n'
              '            request,\n'
              '            "the vertex attribute count exceeds an admitted or created-device limit",\n'
              '        ));\n'
              '    }',
          )
          replace_once(
              render,
              '        if layout.array_stride() > u64::from(native_limits.max_vertex_buffer_array_stride) {\n'
              '            return Err(incompatible(\n'
              '                request,\n'
              '                "a vertex-buffer stride exceeds the created-device limit",\n'
              '            ));\n'
              '        }',
              '        if layout.array_stride() > u64::from(device_limits.max_vertex_buffer_array_stride())\n'
              '            || layout.array_stride()\n'
              '                > u64::from(workload_limits.max_vertex_buffer_array_stride())\n'
              '        {\n'
              '            return Err(incompatible(\n'
              '                request,\n'
              '                "a vertex-buffer stride exceeds an admitted or created-device limit",\n'
              '            ));\n'
              '        }',
          )

          total_calls = 0
          for path in sorted(list(Path('src').rglob('*.rs')) + list(Path('tests').rglob('*.rs'))):
              total_calls += append_gpu_limits_new_args(path)
          if total_calls != 14:
              raise SystemExit(f'expected 14 GpuLimits::new call sites, changed {total_calls}')

          # The two non-baseline call sites use native/effective values rather than constructor defaults.
          replace_once(
              'src/api/context/admission.rs',
              '            u32_value(GpuLimitKind::MaxComputeWorkgroupsPerDimension)?,\n        ),',
              '            u32_value(GpuLimitKind::MaxComputeWorkgroupsPerDimension)?,\n'
              '            value(GpuLimitKind::MaxBufferSize),\n'
              '            u32_value(GpuLimitKind::MaxTextureDimension1d)?,\n'
              '            u32_value(GpuLimitKind::MaxTextureDimension3d)?,\n'
              '            u32_value(GpuLimitKind::MaxTextureArrayLayers)?,\n'
              '            u32_value(GpuLimitKind::MaxVertexAttributes)?,\n'
              '            u32_value(GpuLimitKind::MaxVertexBufferArrayStride)?,\n'
              '        ),',
          ) if False else None

          print(f'migrated {total_calls} public GpuLimits::new call sites')
          PY

          git diff --check
          grep -R -n -E 'device\.limits\(\).*max_buffer_size|max_texture_dimension_1d|max_texture_dimension_3d|max_texture_array_layers|max_vertex_attributes|max_vertex_buffer_array_stride' src/backend/wgpu/resource_realization src/backend/wgpu/pipeline_realization || true
      - name: Commit bounded implementation
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'Aschenrot'
          git config user.email '128308156+aschenrot@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git commit -m 'gpu: normalize public descriptor limit authority'
          git push origin "HEAD:$BRANCH"
