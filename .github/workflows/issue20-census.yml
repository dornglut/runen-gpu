              '        assert_eq!(limits.max_texture_dimension_3d(), 2048);\n'
              '        assert_eq!(limits.max_texture_array_layers(), 256);\n'
              '        assert_eq!(limits.max_vertex_attributes(), 16);\n'
              '        assert_eq!(limits.max_vertex_buffer_array_stride(), 2048);',
          )

          descriptor = 'src/api/context/descriptor.rs'
          replace_once(
