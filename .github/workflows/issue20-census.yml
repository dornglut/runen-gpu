name: Issue 20 implementation helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'issue-20-normalized-public-descriptor-limits'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          clean: true
          fetch-depth: 0
          persist-credentials: true
      - name: Prove exact helper parent
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Apply bounded issue 20 transformation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('.')
          BASELINE_ARGS = [
              '256 * 1024 * 1024',
              '8192',
              '2048',
              '256',
              '16',
              '2048',
          ]

          def read(path):
              return (ROOT / path).read_text()

          def write(path, text):
              (ROOT / path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          def append_gpu_limits_new_args(path):
              text = read(path)
              marker = 'GpuLimits::new('
              out = []
              cursor = 0
              changed = 0
              while True:
                  start = text.find(marker, cursor)
                  if start < 0:
                      out.append(text[cursor:])
                      break
                  open_paren = start + len(marker) - 1
                  depth = 1
                  index = open_paren + 1
                  while index < len(text) and depth:
                      if text[index] == '(':
                          depth += 1
                      elif text[index] == ')':
                          depth -= 1
                      index += 1
                  if depth != 0:
                      raise SystemExit(f'{path}: unterminated GpuLimits::new call')
                  close_paren = index - 1
                  out.append(text[cursor:close_paren])
                  prior = close_paren - 1
                  while prior >= 0 and text[prior].isspace():
                      prior -= 1
                  separator = ' ' if text[prior] == ',' else ', '
                  out.append(separator + ', '.join(BASELINE_ARGS))
                  cursor = close_paren
                  changed += 1
              if changed:
                  write(path, ''.join(out))
              return changed

          capability = 'src/api/capability.rs'
          if 'max_buffer_size: u64' in read(capability):
              raise SystemExit('issue 20 transformation already applied')

          replace_once(
              capability,
              '    max_compute_workgroups_per_dimension: u32,\n}',
              '    max_compute_workgroups_per_dimension: u32,\n'
              '    max_buffer_size: u64,\n'
              '    max_texture_dimension_1d: u32,\n'
              '    max_texture_dimension_3d: u32,\n'
              '    max_texture_array_layers: u32,\n'
              '    max_vertex_attributes: u32,\n'
              '    max_vertex_buffer_array_stride: u32,\n}',
          )
          replace_once(
              capability,
              '        max_compute_workgroups_per_dimension: u32,\n    ) -> Result<Self, GpuCapabilityAdmissionError> {',
              '        max_compute_workgroups_per_dimension: u32,\n'
              '        max_buffer_size: u64,\n'
              '        max_texture_dimension_1d: u32,\n'
              '        max_texture_dimension_3d: u32,\n'
              '        max_texture_array_layers: u32,\n'
              '        max_vertex_attributes: u32,\n'
              '        max_vertex_buffer_array_stride: u32,\n'
              '    ) -> Result<Self, GpuCapabilityAdmissionError> {',
          )
          replace_once(
              capability,
              '            || max_compute_workgroups_per_dimension == 0\n'
              '            || max_bind_groups_plus_vertex_buffers < max_bind_groups',
              '            || max_compute_workgroups_per_dimension == 0\n'
              '            || max_buffer_size == 0\n'
              '            || max_texture_dimension_1d == 0\n'
              '            || max_texture_dimension_3d == 0\n'
              '            || max_texture_array_layers == 0\n'
              '            || max_vertex_attributes == 0\n'
              '            || max_vertex_buffer_array_stride == 0\n'
              '            || max_bind_groups_plus_vertex_buffers < max_bind_groups',
