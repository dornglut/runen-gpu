              '        assert_eq!(limits.max_compute_workgroups_per_dimension(), 65535);',
              '        assert_eq!(limits.max_compute_workgroups_per_dimension(), 65535);\n'
              '        assert_eq!(limits.max_buffer_size(), 256 * 1024 * 1024);\n'
