              '        self.max_compute_workgroups_per_dimension\n'
              '    }',
              '    pub const fn max_compute_workgroups_per_dimension(self) -> u32 {\n'
              '        self.max_compute_workgroups_per_dimension\n'
              '    }\n'
              '    pub const fn max_buffer_size(self) -> u64 {\n'
