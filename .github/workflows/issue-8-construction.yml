name: Issue 8 Candidate Construction

on:
  push:
    branches:
      - "fix/readback-source-8"

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/readback-source-8
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact issue 8 source changes
        run: python3 .github/issue-8-construct.py

      - name: Format and compile candidate
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          cargo +stable fmt --all
          cargo +stable test --locked --no-run
          git diff --check

      - name: Commit candidate and remove construction files
        run: |
          set -euo pipefail
          rm .github/workflows/issue-8-construction.yml .github/issue-8-construct.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "gpu: retain exact readback source region"
          git push origin HEAD:fix/readback-source-8
