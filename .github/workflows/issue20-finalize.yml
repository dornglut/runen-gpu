name: Issue 20 candidate finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'issue-20-normalized-public-descriptor-limits'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          clean: true
          fetch-depth: 0
          persist-credentials: true
      - name: Prove exact finalizer parent
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Install maintained stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Format candidate
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          git diff --check
      - name: Commit formatting locally
        run: |
          set -euo pipefail
          git config user.name 'Aschenrot'
          git config user.email '128308156+aschenrot@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No formatting changes required.'
          else
            git add src tests
            git diff --cached --check
            git commit -m 'style: format normalized limit migration'
          fi
          test -z "$(git status --porcelain)"
      - name: Validate clean formatted candidate
        run: |
          set -euo pipefail
          cargo validate
          test -z "$(git status --porcelain)"
      - name: Publish validated candidate
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git push origin "HEAD:$BRANCH"
