# Temporary CI-only source snapshot to repair the #27 draft; remove before review.
name: RunenGPU RGBA16 temporary format snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runengpu-rgba16-format-diagnostics.yml'

permissions:
  contents: read

jobs:
  format-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify revision and format tracked sources
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
          git diff --check
      - name: Capture formatted sources and baseline counterparts
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/rgba16-format-snapshot"
          mkdir -p "$root/current" "$root/base"
          for path in \
            src/api/capability.rs \
            src/api/program/analysis.rs \
            src/api/texture_format.rs \
            src/backend/wgpu/adapter_mapping.rs \
            src/backend/wgpu/pipeline_realization/render_mapping.rs \
            src/backend/wgpu/program_binding_realization/lowering.rs \
            src/backend/wgpu/resource_realization/lowering.rs \
            tests/gpu_browser_webgpu.rs \
            tests/gpu_browser_webgpu/run.py \
            tests/gpu_r1_rgba16_texture_formats.rs; do
            mkdir -p "$root/current/$(dirname "$path")"
            cp "$path" "$root/current/$path"
          done
          for path in src/api/capability.rs src/api/program/analysis.rs; do
            mkdir -p "$root/base/$(dirname "$path")"
            git show "HEAD^:$path" > "$root/base/$path"
          done
          git diff --stat
          test -s "$root/current/tests/gpu_r1_rgba16_texture_formats.rs"
      - name: Upload formatting snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runengpu-rgba16-format-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/rgba16-format-snapshot
          if-no-files-found: error
          retention-days: 1
